<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evangelio del Día — Generador de Historias</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <!-- ============ ENCABEZADO ============ -->
    <header class="app-header">
      <h1>✝️ Evangelio del Día</h1>
      <p class="subtitle">Tu momento diario con la Palabra</p>
    </header>

    <!-- ============ BANNER DE ERRORES / AVISOS ============ -->
    <div id="banner" class="banner hidden" role="alert"></div>

    <!-- ============ PASO 1: GENERAR ============ -->
    <section class="card" id="stepGenerate">
      <button id="btnGenerar" class="btn btn-primary btn-big">
        GENERAR EVANGELIO DE HOY
      </button>

      <button id="btnToggleAvanzado" class="btn-link">
        Opciones avanzadas (probar otra fecha / modo manual)
      </button>

      <div id="panelAvanzado" class="hidden">
        <label class="field">
          <span>Fecha a usar</span>
          <input type="date" id="inputFecha">
        </label>
        <button id="btnManual" class="btn btn-secondary">
          Cargar Evangelio manualmente
        </button>
      </div>
    </section>

    <!-- ============ PASO 2: DATOS DEL EVANGELIO ============ -->
    <section class="card hidden" id="stepData">
      <p class="field-line">📅 <span id="displayFecha">—</span></p>
      <p class="field-line">📖 Evangelio según San
        <select id="selectSanto">
          <option value="Mateo">Mateo</option>
          <option value="Marcos">Marcos</option>
          <option value="Lucas">Lucas</option>
          <option value="Juan">Juan</option>
          <option value="Otro">Otro / no aplica</option>
        </select>
      </p>

      <div class="field-row">
        <label class="field">
          <span>Capítulo</span>
          <input type="text" id="inputCapitulo" placeholder="Ej: 14">
        </label>
        <label class="field">
          <span>Versículos</span>
          <input type="text" id="inputVersiculos" placeholder="Ej: 25-33">
        </label>
      </div>

      <label class="field">
        <span>Texto del Evangelio (en español — pegalo de tu misal o Biblia)</span>
        <textarea id="inputTexto" rows="8" placeholder="En aquel tiempo, Jesús dijo a sus discípulos..."></textarea>
      </label>

      <div class="field">
        <span>Logo de la iglesia (opcional)</span>
        <div class="logo-row">
          <input type="file" id="inputLogo" accept="image/*">
          <button id="btnQuitarLogo" class="btn-link">Quitar logo</button>
        </div>
      </div>

      <div class="btn-row">
        <button id="btnPreview" class="btn btn-secondary">PREVISUALIZAR</button>
        <button id="btnDescargar" class="btn btn-primary" disabled>DESCARGAR PNG</button>
      </div>
    </section>

    <!-- ============ VISTA PREVIA ============ -->
    <section class="card hidden" id="stepPreview">
      <h2 class="card-title">Vista previa de la historia</h2>
      <div class="canvas-wrap">
        <canvas id="storyCanvas" width="1080" height="1920"></canvas>
      </div>
    </section>

    <!-- ============ HISTORIAL ============ -->
    <section class="card" id="stepHistory">
      <h2 class="card-title">Historial de Evangelios generados</h2>
      <ul id="historyList" class="history-list">
        <li class="history-empty">Todavía no generaste ningún Evangelio.</li>
      </ul>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
